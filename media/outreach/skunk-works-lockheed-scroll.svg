<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">To Whom It May Concern or Interest - Unofficial Skunk Works and Lockheed Martin Concept</title>
  <desc id="desc">A detailed animated parchment scroll opening to invite the viewer to the Screenless Sight Codex GitHub project, with an unofficial aviation-inspired concept seal referencing Lockheed Martin and Skunk Works.</desc>
  <style>
    :root {
      --ink: #2a241c;
      --muted: #6d604d;
      --paper: #f2dfb5;
      --paper-deep: #d5ad68;
      --line: #8a6530;
      --wax: #8f1d2d;
      --blue: #203f65;
      --green: #2f6248;
    }

    .bg { fill: #101721; }
    .stage-glow { fill: url(#stageGlow); opacity: 0.92; }
    .star {
      fill: #d6e6ff;
      opacity: 0.3;
      animation: twinkle 3.6s ease-in-out infinite;
    }
    .star:nth-of-type(2n) { animation-delay: -1.5s; }

    .rod {
      fill: url(#rodGrad);
      stroke: #704b1f;
      stroke-width: 2.5;
    }
    .rod-highlight {
      fill: none;
      stroke: #f5d38b;
      stroke-width: 3;
      opacity: 0.56;
    }
    .rod-cap {
      fill: #a87834;
      stroke: #704b1f;
      stroke-width: 2.5;
    }
    .rod-cap-inner {
      fill: none;
      stroke: #e0b86e;
      stroke-width: 3;
      opacity: 0.72;
    }
    .paper-shadow {
      fill: #000;
      opacity: 0.24;
      filter: blur(16px);
      transform-origin: 600px 430px;
      animation: shadowGrow 7.2s ease-in-out infinite;
    }
    .paper-sheet {
      transform-box: fill-box;
      transform-origin: 50% 0%;
      animation: paperOpen 7.2s cubic-bezier(0.22, 0.7, 0.3, 1) infinite;
    }
    .paper {
      fill: url(#paperGrad);
      stroke: var(--line);
      stroke-width: 2.5;
      filter: url(#softShadow);
    }
    .paper-inner {
      fill: none;
      stroke: #fff6d9;
      stroke-width: 2;
      opacity: 0.48;
    }
    .paper-edge {
      fill: none;
      stroke: rgba(138, 101, 48, 0.4);
      stroke-width: 2;
    }
    .paper-fold {
      fill: none;
      stroke: rgba(105, 70, 29, 0.24);
      stroke-width: 4;
      stroke-linecap: round;
    }
    .paper-rule {
      fill: none;
      stroke: rgba(105, 70, 29, 0.18);
      stroke-width: 1.5;
    }
    .paper-fleck {
      fill: #a67532;
      opacity: 0.18;
    }
    .corner-mark {
      fill: none;
      stroke: #a67532;
      stroke-width: 2;
      opacity: 0.5;
    }

    .content {
      opacity: 0;
      animation: fadeText 7.2s ease-in-out infinite;
    }
    .small-caps {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 20px;
      letter-spacing: 2.5px;
      fill: var(--muted);
    }
    .headline {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 55px;
      font-weight: 700;
      fill: var(--ink);
    }
    .subtitle {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 28px;
      fill: var(--ink);
    }
    .body {
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 20px;
      fill: #332b20;
    }
    .signature {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 31px;
      font-style: italic;
      fill: var(--ink);
    }
    .button {
      fill: #203f65;
      stroke: #102336;
      stroke-width: 2;
      filter: url(#buttonShadow);
    }
    .button-text {
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 20px;
      font-weight: 700;
      fill: #f5f0e5;
    }

    .route-line {
      fill: none;
      stroke: var(--green);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-dasharray: 10 12;
      opacity: 0.8;
      animation: route 7.2s linear infinite;
    }
    .node {
      fill: #f7eed7;
      stroke: var(--green);
      stroke-width: 3;
    }
    .node-label {
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 15px;
      font-weight: 700;
      fill: var(--green);
    }
    .seal {
      fill: url(#sealGrad);
      stroke: #5b0e1b;
      stroke-width: 2.5;
      filter: url(#buttonShadow);
      transform-origin: 950px 585px;
      animation: sealPulse 7.2s ease-in-out infinite;
    }
    .seal-ring {
      fill: none;
      stroke: #e78b80;
      stroke-width: 2;
      opacity: 0.72;
    }
    .seal-mark {
      fill: none;
      stroke: #ffd8a6;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.88;
    }
    .badge-wordmark {
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.8px;
      fill: #fff1d3;
    }
    .badge-name {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      fill: #fff1d3;
    }
    .badge-unofficial {
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 7px;
      font-weight: 700;
      letter-spacing: 0.8px;
      fill: #f4c8a3;
    }
    .badge-skunk {
      fill: #f7dfbd;
      stroke: #5b0e1b;
      stroke-width: 1.5;
      stroke-linejoin: round;
    }
    .badge-stripe {
      fill: none;
      stroke: #8f1d2d;
      stroke-width: 3;
      stroke-linecap: round;
    }
    .badge-star {
      fill: #fff1d3;
      opacity: 0.92;
    }

    .bottom-roll {
      transform-box: view-box;
      transform-origin: 0 0;
      animation: lowerRoll 7.2s cubic-bezier(0.22, 0.7, 0.3, 1) infinite;
    }
    .bottom-paper-band {
      fill: url(#paperGrad);
      stroke: var(--line);
      stroke-width: 2;
    }
    .coil-line {
      fill: none;
      stroke: rgba(105, 70, 29, 0.42);
      stroke-width: 3;
      stroke-linecap: round;
    }

    @keyframes paperOpen {
      0%, 10% { transform: scaleY(0.035); }
      34%, 84% { transform: scaleY(1); }
      100% { transform: scaleY(0.035); }
    }
    @keyframes lowerRoll {
      0%, 10% { transform: translateY(0); }
      34%, 84% { transform: translateY(570px); }
      100% { transform: translateY(0); }
    }
    @keyframes fadeText {
      0%, 23% { opacity: 0; transform: translateY(-14px); }
      37%, 82% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-10px); }
    }
    @keyframes shadowGrow {
      0%, 10% { transform: scaleY(0.12); opacity: 0.08; }
      34%, 84% { transform: scaleY(1); opacity: 0.24; }
      100% { transform: scaleY(0.12); opacity: 0.08; }
    }
    @keyframes route {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -44; }
    }
    @keyframes sealPulse {
      0%, 35%, 100% { transform: scale(1); }
      54% { transform: scale(1.06); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.18; }
      50% { opacity: 0.52; }
    }
  </style>

  <defs>
    <radialGradient id="stageGlow" cx="50%" cy="46%" r="64%">
      <stop offset="0%" stop-color="#334a5c"/>
      <stop offset="58%" stop-color="#16212d"/>
      <stop offset="100%" stop-color="#0a0f15"/>
    </radialGradient>
    <linearGradient id="paperGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff2cf"/>
      <stop offset="48%" stop-color="#f2dfb5"/>
      <stop offset="100%" stop-color="#d8b06c"/>
    </linearGradient>
    <linearGradient id="rodGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c99142"/>
      <stop offset="50%" stop-color="#8f5c25"/>
      <stop offset="100%" stop-color="#ddb06b"/>
    </linearGradient>
    <radialGradient id="sealGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#c74955"/>
      <stop offset="60%" stop-color="#8f1d2d"/>
      <stop offset="100%" stop-color="#5b0e1b"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <filter id="buttonShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect class="bg" width="1200" height="820"/>
  <rect class="stage-glow" width="1200" height="820"/>

  <circle class="star" cx="112" cy="94" r="2.5"/>
  <circle class="star" cx="202" cy="678" r="2"/>
  <circle class="star" cx="1018" cy="92" r="2.7"/>
  <circle class="star" cx="1104" cy="640" r="1.9"/>
  <circle class="star" cx="840" cy="742" r="2.4"/>
  <circle class="star" cx="330" cy="72" r="1.8"/>
  <circle class="star" cx="75" cy="372" r="1.6"/>
  <circle class="star" cx="1148" cy="320" r="1.5"/>

  <ellipse class="paper-shadow" cx="600" cy="440" rx="470" ry="282"/>

  <a href="https://github.com/Tboy450/beyond-the-screen-visual-transduction" target="_blank" rel="noopener" aria-label="Open the Screenless Sight Codex GitHub project">
    <g class="paper-sheet">
      <rect class="paper" x="150" y="140" width="900" height="570" rx="18"/>
      <rect class="paper-inner" x="170" y="160" width="860" height="530" rx="12"/>

      <path class="paper-edge" d="M185 164 C250 145, 320 154, 386 165 S520 177, 594 160 S730 145, 816 164 S952 180, 1016 158"/>
      <path class="paper-edge" d="M184 688 C264 704, 338 684, 420 696 S568 710, 650 690 S790 678, 876 696 S964 704, 1018 684"/>
      <path class="paper-fold" d="M184 190 C208 250, 196 310, 188 364 S204 484, 185 552 S198 636, 184 668"/>
      <path class="paper-fold" d="M1016 192 C992 250, 1004 316, 1012 376 S996 488, 1015 554 S1002 636, 1016 670"/>
      <path class="paper-rule" d="M244 264 C380 254, 820 254, 956 264"/>
      <path class="paper-rule" d="M244 548 C396 558, 804 558, 956 548"/>
      <path class="corner-mark" d="M210 222 l0 -20 l20 0 M990 222 l0 -20 l-20 0 M210 626 l0 20 l20 0 M990 626 l0 20 l-20 0"/>

      <circle class="paper-fleck" cx="220" cy="292" r="3"/>
      <circle class="paper-fleck" cx="975" cy="326" r="2.5"/>
      <circle class="paper-fleck" cx="268" cy="590" r="2"/>
      <circle class="paper-fleck" cx="924" cy="622" r="3"/>

      <g class="content">
        <text class="small-caps" x="600" y="207" text-anchor="middle">TO WHOM IT MAY CONCERN</text>
        <text class="small-caps" x="600" y="235" text-anchor="middle">OR INTEREST</text>
        <text class="headline" x="600" y="302" text-anchor="middle">Screenless Sight Codex</text>
        <text class="subtitle" x="600" y="340" text-anchor="middle">Particles, Pixels, and Perception</text>

        <path class="route-line" d="M255 425 C320 390, 390 460, 470 425 S610 390, 690 425 S830 460, 945 425"/>
        <circle class="node" cx="255" cy="425" r="34"/>
        <circle class="node" cx="485" cy="425" r="34"/>
        <circle class="node" cx="715" cy="425" r="34"/>
        <circle class="node" cx="945" cy="425" r="34"/>
        <text class="node-label" x="255" y="430" text-anchor="middle">carrier</text>
        <text class="node-label" x="485" y="430" text-anchor="middle">code</text>
        <text class="node-label" x="715" y="430" text-anchor="middle">cue</text>
        <text class="node-label" x="945" y="430" text-anchor="middle">mind</text>

        <text class="body" x="600" y="503" text-anchor="middle">A historical and speculative map for rerouting</text>
        <text class="body" x="600" y="531" text-anchor="middle">display logic toward perception as the medium.</text>
        <text class="signature" x="312" y="615" text-anchor="middle">Tristan Hash</text>

        <rect class="button" x="430" y="610" width="340" height="48" rx="12"/>
        <text class="button-text" x="600" y="640" text-anchor="middle">Open the GitHub Project</text>

        <circle class="seal" cx="950" cy="585" r="62"/>
        <circle class="seal-ring" cx="950" cy="585" r="49"/>
        <text class="badge-wordmark" x="950" y="544" text-anchor="middle">LOCKHEED MARTIN</text>
        <polygon class="badge-star" points="950,551 953,558 961,558 955,563 957,571 950,566 943,571 945,563 939,558 947,558"/>
        <path class="badge-skunk" d="M925 591 C920 583, 923 572, 933 569 C938 560, 950 558, 958 565 C968 563, 977 569, 977 579 C977 590, 968 596, 958 596 C950 596, 945 592, 939 588 C935 593, 929 595, 925 591 Z"/>
        <path class="badge-stripe" d="M940 568 C944 574, 947 582, 949 591 M948 565 C952 572, 955 580, 957 591"/>
        <circle cx="966" cy="573" r="1.7" fill="#5b0e1b"/>
        <text class="badge-name" x="950" y="616" text-anchor="middle">SKUNK WORKS</text>
        <text class="badge-unofficial" x="950" y="632" text-anchor="middle">UNOFFICIAL CONCEPT</text>
      </g>
    </g>

    <g class="top-roll">
      <rect class="rod" x="135" y="112" width="930" height="48" rx="24"/>
      <path class="rod-highlight" d="M174 125 C360 113, 810 113, 1026 126"/>
      <circle class="rod-cap" cx="128" cy="136" r="32"/>
      <circle class="rod-cap" cx="1072" cy="136" r="32"/>
      <circle class="rod-cap-inner" cx="128" cy="136" r="19"/>
      <circle class="rod-cap-inner" cx="1072" cy="136" r="19"/>
      <path class="coil-line" d="M174 144 C230 168, 300 168, 352 144 M848 144 C900 168, 970 168, 1026 144"/>
    </g>

    <g class="bottom-roll">
      <path class="bottom-paper-band" d="M174 128 C250 118, 330 126, 404 138 S560 148, 640 136 S796 118, 1026 132 L1026 164 C930 176, 842 164, 760 154 S598 146, 510 158 S330 176, 174 160 Z"/>
      <rect class="rod" x="135" y="112" width="930" height="48" rx="24"/>
      <path class="rod-highlight" d="M174 125 C360 113, 810 113, 1026 126"/>
      <circle class="rod-cap" cx="128" cy="136" r="32"/>
      <circle class="rod-cap" cx="1072" cy="136" r="32"/>
      <circle class="rod-cap-inner" cx="128" cy="136" r="19"/>
      <circle class="rod-cap-inner" cx="1072" cy="136" r="19"/>
      <path class="coil-line" d="M174 144 C230 168, 300 168, 352 144 M848 144 C900 168, 970 168, 1026 144"/>
    </g>
  </a>
</svg>
